name: Testar acesso FTP

on:
  workflow_dispatch:

permissions: {}

jobs:
  autenticar:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Testar login sem enviar arquivos
        continue-on-error: true
        env:
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        shell: bash
        run: |
          python3 -u - <<'PY'
          import ftplib
          import os
          import signal
          import ssl
          import sys

          phase = 'preparacao'
          def deadline_expired(signum, frame):
              print(f'::error::Limite total de 45 segundos excedido na etapa {phase}.')
              sys.exit(1)

          signal.signal(signal.SIGALRM, deadline_expired)
          signal.alarm(45)

          username = os.environ.get('FTP_USER', '')
          password = os.environ.get('FTP_PASSWORD', '')
          for name, value in [('FTP_USER', username), ('FTP_PASSWORD', password)]:
              if not value:
                  print(f'::error::{name} ausente ou vazio nesta execucao.')
                  sys.exit(1)
              if value != value.strip() or '\r' in value or '\n' in value:
                  print(f'::error::{name} contem espacos nas extremidades ou quebra de linha.')
                  sys.exit(1)

          print('Os dois secrets estao presentes e sem espacos nas extremidades.')
          print('FTP_USER corresponde a eoraeyewear:', username == 'eoraeyewear')
          phase = 'conexao'
          ftp = ftplib.FTP_TLS(context=ssl.create_default_context(), timeout=15)
          try:
              ftp.connect('ftp.nuvemshop.com.br', 21)
              print('Conexao na porta 21 estabelecida.')
              phase = 'TLS'
              ftp.auth()
              print('FTPS explicito estabelecido.')
              phase = 'usuario (USER)'
              reply = ftp.sendcmd('USER ' + username)
              code = reply[:3]
              print('Resposta ao usuario:', code)
              if code == '331':
                  phase = 'senha (PASS)'
                  reply = ftp.sendcmd('PASS ' + password)
                  code = reply[:3]
                  print('Resposta a senha:', code)
              if code != '230':
                  print('::error::O servidor nao confirmou a autenticacao com codigo 230.')
                  sys.exit(1)
              print('Login confirmado. Nenhum arquivo foi enviado, excluido ou alterado.')
          except ftplib.Error as error:
              raw_code = str(error)[:3]
              code = raw_code if raw_code.isdigit() else 'indisponivel'
              print(f'::error::Falha na etapa {phase}; codigo FTP: {code}.')
              sys.exit(1)
          except (OSError, ssl.SSLError, EOFError) as error:
              print(f'::error::Falha na etapa {phase}; tipo: {type(error).__name__}.')
              sys.exit(1)
          finally:
              signal.alarm(0)
              ftp.close()
          PY
      - name: Preparar Node 24 para comparar os clientes
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Instalar somente a biblioteca usada pela action
        shell: bash
        run: npm install --prefix "$RUNNER_TEMP/eora-ftp-auth" --no-audit --no-fund --ignore-scripts basic-ftp@5.0.5
      - name: Comparar login da action com as variacoes TLS
        env:
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        shell: bash
        run: |
          node <<'JS'
          const path = require('node:path');
          const { Client } = require(path.join(process.env.RUNNER_TEMP, 'eora-ftp-auth/node_modules/basic-ftp'));
          const host = 'ftp.nuvemshop.com.br';
          const user = process.env.FTP_USER;
          const password = process.env.FTP_PASSWORD;
          if (!user || !password || [user, password].some(value => value !== value.trim() || /[\r\n]/.test(value))) {
            console.log('::error::Secrets ausentes ou com espacos/quebras de linha.');
            process.exit(1);
          }
          console.log('Node:', process.version);
          let activeClient;
          const deadline = setTimeout(() => {
            console.log('::error::Comparacao encerrada apos 60 segundos.');
            activeClient?.close();
            process.exit(1);
          }, 60000);
          async function test(label, mode) {
            const client = new Client(15000);
            activeClient = client;
            client.ftp.verbose = false;
            console.log('Iniciando:', label);
            try {
              if (mode === 'python') {
                await client.connect(host, 21);
                await client.useTLS({ host, servername: host, rejectUnauthorized: true });
                await client.login(user, password);
              } else {
                const secureOptions = mode === 'sni'
                  ? { servername: host, rejectUnauthorized: true }
                  : { rejectUnauthorized: false };
                await client.access({ host, port: 21, user, password, secure: true, secureOptions });
              }
              console.log(label + ': login confirmado.');
              return true;
            } catch (error) {
              const code = Number.isInteger(error.code) ? error.code : 'indisponivel';
              console.log('::warning::' + label + ': falhou; codigo FTP ' + code + '.');
              return false;
            } finally {
              client.close();
              activeClient = undefined;
            }
          }
          (async () => {
            try {
              const results = [];
              results.push(await test('Configuracao original da action', 'action'));
              results.push(await test('Action identificando o host no TLS (SNI)', 'sni'));
              results.push(await test('Node com a ordem de login do Python', 'python'));
              console.log('Comparacao concluida. Nenhum arquivo foi enviado, excluido ou alterado.');
              if (!results.some(Boolean)) process.exitCode = 1;
            } finally {
              clearTimeout(deadline);
            }
          })().catch(() => {
            console.log('::error::Falha inesperada na comparacao.');
            process.exitCode = 1;
          });
          JS
