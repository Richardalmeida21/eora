name: Deploy Eora

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Prepare and verify theme dependencies
        env:
          NODE_PATH: ${{ runner.temp }}/eora-deploy-deps/node_modules
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          npm install --prefix "$RUNNER_TEMP/eora-deploy-deps" --no-audit --no-fund basic-ftp@6.2.3
          node --test .github/tests/stage-theme-dependencies.cjs
          node .github/scripts/stage-theme-dependencies.cjs

      - name: Deploy theme changes
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftp.nuvemshop.com.br
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          server-dir: /
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/product-name-pt-data.tpl
            **/.product-name-pt-data.pending.tpl
            **/product-name-pt-v2-data.tpl
            **/product-name-pt-v2-data.backup.tpl
            **/.product-name-pt-v2-data.pending.tpl
